$ErrorActionPreference = 'Stop'
$source = '.\db2_ddl_exporter-transfer.txt'
$destination = '.\db2_ddl_exporter'
if (Test-Path -LiteralPath $destination) { throw 'Destination already exists. Change $destination to a new folder.' }
$json = Get-Content -LiteralPath $source | Where-Object { $_.StartsWith('[{') }
if (@($json).Count -ne 1) { throw 'Expected one JSON data line in the transfer file.' }
$items = ConvertFrom-Json -InputObject $json
$alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
foreach ($item in $items) {
    if ($item.Path -match '(^[/\\]|:|(^|[/\\])\.\.([/\\]|$))') { throw 'Invalid file path.' }
    if ($item.Data.Length % 4 -ne 0 -or $item.Data -notmatch '^[A-Za-z0-9+/]*={0,2}$') { throw 'Invalid file data.' }
}
$null = New-Item -ItemType Directory -Path $destination
foreach ($item in $items) {
    $path = Join-Path $destination $item.Path
    $parent = Split-Path -Parent $path
    $null = New-Item -ItemType Directory -Path $parent -Force
    $data = $item.Data
    [byte[]]$bytes = @(for ($i = 0; $i -lt $data.Length; $i += 4) {
        $a = $alphabet.IndexOf($data[$i])
        $b = $alphabet.IndexOf($data[$i + 1])
        ($a -shl 2) -bor ($b -shr 4)
        if ($data[$i + 2] -ne '=') {
            $c = $alphabet.IndexOf($data[$i + 2])
            (($b -band 15) -shl 4) -bor ($c -shr 2)
            if ($data[$i + 3] -ne '=') {
                $d = $alphabet.IndexOf($data[$i + 3])
                (($c -band 3) -shl 6) -bor $d
            }
        }
    })
    if ($bytes.Length -eq 0) { $null = New-Item -ItemType File -Path $path }
    else { Set-Content -LiteralPath $path -Value $bytes -Encoding Byte }
}
Write-Host "Restored $($items.Count) files to $destination"
